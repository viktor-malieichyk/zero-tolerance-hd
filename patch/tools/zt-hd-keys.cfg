# Zero Tolerance HD: RetroArch keys for this game only (a game override, written by the launcher; delete
# it to go back to your own). Player 1's keyboard moves off W A S D C E, the HD renderer reads those itself
# (Keyboard: Modern): Space is Genesis A (jump), R Genesis Y, Tab Genesis Z; Z, X, Q, Enter as RetroArch's
# defaults. Hotkeys on those keys and on M / N (the HD menu) are off. The mouse is held for turning.
input_player1_y = "space"
input_player1_x = "r"
input_player1_r = "tab"
input_toggle_fast_forward = "nul"
input_hold_slowmotion = "nul"
input_rewind = "nul"
input_shader_next = "nul"
input_shader_prev = "nul"
input_auto_mouse_grab = "true"
